
name: iPlay iPhone Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and fix iPlay extension
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone archive
        run: |
          xcodebuild archive \
            -project iPlay.xcodeproj \
            -scheme iPlay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iPlay.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Repair Messages extension metadata
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          plist_path = Path(
              "build/iPlay.xcarchive/Products/Applications/"
              "iPlay.app/PlugIns/iPlayMessages.appex/Info.plist"
          )

          if not plist_path.exists():
              raise SystemExit(f"Missing extension plist: {plist_path}")

          with plist_path.open("rb") as f:
              data = plistlib.load(f)

          data["NSExtension"] = {
              "NSExtensionPointIdentifier":
                  "com.apple.message-payload-provider",
              "NSExtensionPrincipalClass":
                  "$(PRODUCT_MODULE_NAME).MessagesViewController"
          }

          with plist_path.open("wb") as f:
              plistlib.dump(data, f, fmt=plistlib.FMT_XML)

          print("Messages extension metadata repaired.")
          PY

      - name: Verify Messages extension
        run: |
          EXT="build/iPlay.xcarchive/Products/Applications/iPlay.app/PlugIns/iPlayMessages.appex"

          plutil -lint "$EXT/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :NSExtension:NSExtensionPointIdentifier" \
            "$EXT/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :NSExtension:NSExtensionPrincipalClass" \
            "$EXT/Info.plist"

          test -d "$EXT"

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload

          cp -R \
            build/iPlay.xcarchive/Products/Applications/iPlay.app \
            build/ipa/Payload/iPlay.app

          cd build/ipa
          zip -r ../iPlay-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iPlay-iPhone-Unsigned
          path: build/iPlay-unsigned.ipa
          retention-days: 7

      - name: Upload Xcode archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPlay-Xcode-Archive
          path: build/iPlay.xcarchive
          retention-days: 7
          if-no-files-found: warn
