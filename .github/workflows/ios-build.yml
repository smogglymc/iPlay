
name: iPlay iPhone Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iPlay for iPhone
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List Xcode schemes
        run: xcodebuild -list -project iPlay.xcodeproj

      - name: Build iPhone archive
        run: |
          xcodebuild archive \
            -project iPlay.xcodeproj \
            -scheme iPlay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iPlay.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload

          cp -R build/iPlay.xcarchive/Products/Applications/iPlay.app \
            build/ipa/Payload/iPlay.app

          cd build/ipa
          zip -r ../iPlay-unsigned.ipa Payload

      - name: Upload iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: iPlay-iPhone-Unsigned
          path: build/iPlay-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
